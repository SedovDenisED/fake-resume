<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Panel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <div class="card" style="max-width:420px;margin:10vh auto;">
      <h1>Panel</h1>
      <p class="muted">Доступ только из туннеля. Пароль или Face&nbsp;ID / passkey.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
        <div class="row" style="margin-top:16px;">
          <button class="btn" type="submit">Войти</button>
          <button class="btn" type="button" id="passkey-login">Face ID / passkey</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/static/webauthn.js"></script>
</body>
</html>
