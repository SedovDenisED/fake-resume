[project]
name = "fake-resume-panel"
version = "0.1.0"
description = "Панель выдачи Happ/VLESS-клиентов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "itsdangerous>=2.2.0",
    "qrcode[pil]>=8.0",
    "pydantic-settings>=2.6.0",
    "webauthn>=2.2.0",
]

[project.scripts]
panel = "panel.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panel"]
