[Interface]
# Home peer: 10.66.66.1/24
# Реальные ключи только в /etc/amnezia/amneziawg/awg-relay.conf — не в git
PrivateKey = REPLACE_HOME_PRIVATE_KEY
Address = 10.66.66.1/24
Jc = 4
Jmin = 40
Jmax = 70
S1 = 0
S2 = 0
H1 = 1
H2 = 2
H3 = 3
H4 = 4

PostUp = ip rule del to 10.66.66.0/24 lookup main priority 10 2>/dev/null || true
PostUp = ip rule add to 10.66.66.0/24 lookup main priority 10
PostUp = ip rule del from 10.66.66.0/24 lookup main priority 11 2>/dev/null || true
PostUp = ip rule add from 10.66.66.0/24 lookup main priority 11

PostDown = ip rule del to 10.66.66.0/24 lookup main priority 10 2>/dev/null || true
PostDown = ip rule del from 10.66.66.0/24 lookup main priority 11 2>/dev/null || true

[Peer]
# Yandex Cloud
PublicKey = REPLACE_YC_PUBLIC_KEY
Endpoint = 158.160.232.44:51821
AllowedIPs = 10.66.66.2/32
PersistentKeepalive = 25
